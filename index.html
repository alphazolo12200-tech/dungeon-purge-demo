function ac(){if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(AC&&AC.state==='suspended')AC.resume();if(AC&&!amb){amb=true;const o=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();o.type='sawtooth';o.frequency.value=48;g.gain.value=.025;l.frequency.value=.15;lg.gain.value=.015;l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(AC.destination);o.start();l.start();ambG=g}return AC}
function noise(d,f0,f1,v,ty){const a=AC;if(!a||mute)return;const n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),q=b.getChannelData(0);for(let i=0;i<n;i++)q[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type=ty||'lowpass';f.frequency.setValueAtTime(f0,a.currentTime);f.frequency.exponentialRampToValueAtTime(f1,a.currentTime+d);const g=a.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}

function fits(x,y,w,h){if(x<0||y<0||x+w>gw()||y+h>gh())return false;return !inv.some(i=>x<i.x+i.w&&x+w>i.x&&y<i.y+i.h&&y+h>i.y)}
function spot(w,h){for(const[a,b]of[[w,h],[h,w]])for(let y=0;y<gh();y++)for(let x=0;x<gw();x++)if(fits(x,y,a,b))return[x,y,a,b];return null}
function add(t,q,du){const d=IT[t];if(d.st)for(const i of inv)if(i.t===t&&i.q<d.st){const m=Math.min(q,d.st-i.q);i.q+=m;q-=m;if(!q)return 0}
 while(q>0){const s=spot(d.w,d.h);if(!s)return q;const m=d.st?Math.min(q,d.st):q;inv.push({t,x:s[0],y:s[1],w:s[2],h:s[3],q:m,dur:du!=null?du:d.dur});q-=m}return 0}
const ammoN=t=>inv.filter(i=>i.t===t).reduce((a,i)=>a+i.q,0);
function useAmmo(t){const i=inv.find(i=>i.t===t);if(!i)return false;if(--i.q<=0)inv.splice(inv.indexOf(i),1);return true}
function drop(it){if(P.eq===it)P.eq=null;GR.push({t:it.t,q:it.q,dur:it.dur,x:P.x+R(-30,30),y:P.y+R(-30,30),dl:2})}

 else if(d.k==='s'){P.fx[it.t]=25;inv.splice(inv.indexOf(it),1);say(d.n+': '+d.d+' (25s)');snd('scroll')}
 else say('Ammo is used automatically by matching guns')}

// ---------- WORLD ----------
const FL=document.createElement('canvas'),FX=FL.getContext('2d'),VG=document.createElement('canvas');
(function(){VG.width=VW;VG.height=VH;const g=VG.getContext('2d'),r=g.createRadialGradient(VW/2,VH/2,VH*.35,VW/2,VH/2,VH*.85);r.addColorStop(0,'#0000');r.addColorStop(1,'#000d');g.fillStyle=r;g.fillRect(0,0,VW,VH)})();

 for(let i=0;i<2500;i++){g.fillStyle=Math.random()<.5?'#0003':'#ffffff08';g.fillRect(R(0,W),R(0,H),RI(1,3),RI(1,3))}
 g.strokeStyle='#0007';g.lineWidth=1;for(let i=0;i<40;i++){let x=R(0,W),y=R(0,H);g.beginPath();g.moveTo(x,y);for(let j=0;j<5;j++){x+=R(-18,18);y+=R(-18,18);g.lineTo(x,y)}g.stroke()}
 for(let i=0;i<14;i++)stain(R(0,W),R(0,H),R(15,40),'#3a0d0d44');
 g.strokeStyle='#000';g.lineWidth=14;g.strokeRect(0,0,W,H)}

function inObs(x,y,r){return x<r||y<r||x>W-r||y>H-r||OB.some(o=>x>o.x-r&&x<o.x+o.w+r&&y>o.y-r&&y<o.y+o.h+r)}

function rollLoot(){const p=[];['sword','stealth','handgun','revolver','shotgun'].forEach(w=>{if(IT[w].u<=L+1)p.push([w,1,.5])});

 let s=p.reduce((a,b)=>a+b[2],0)*Math.random();for(const x of p){if((s-=x[2])<=0)return x}return p[0]}
function setup(){OB=[];E=[];B=[];GR=[];PT=[];P.x=80;P.y=H/2;
 for(let i=0;i<8+L;i++)OB.push({x:R(260,W-300),y:R(40,H-200),w:R(50,150),h:R(50,150)});

 const pool=['z'];if(L>=3)pool.push('r','z');if(L>=4)pool.push('s');if(L>=5)pool.push('b');

 for(let i=0;i<4+Math.floor(L/2);i++){const[t,q]=rollLoot();let x,y;do{x=R(200,W-120);y=R(60,H-60)}while(inObs(x,y,14));GR.push({t,q,x,y,dl:0})}
 if(L===1)GR.push({t:'sword',q:1,x:200,y:H/2-60,dl:0},{t:'potion',q:1,x:220,y:H/2+60,dl:0},{t:'light',q:10,x:240,y:H/2,dl:0});

function spawn(k){const t=ET[k];let x,y,n=0;do{x=R(350,W-80);y=R(60,H-60);n++}while(inObs(x,y,t.r+4)&&n<50);

function newGame(){L=1;kills=0;inv=[];held=null;invOpen=false;P={x:80,y:H/2,r:12,hp:100,mx:100,eq:null,fx:{},cd:0,dashT:0,dashCd:0,sw:0,ang:0,dx:1,dy:0,fl:0,hf:0,ph:0};

function dmgE(e,d){if(P.fx.sf>0)d*=2;const dt=P.eq&&IT[P.eq.t];

 if(e.hp<=0&&!e.dead){e.dead=1;kills++;snd('kill');stain(e.x,e.y,e.r*1.6,'#5a0a0acc');FX.fillStyle='#0007';FX.beginPath();FX.ellipse(e.x,e.y,e.r,e.r*.7,e.fa,0,7);FX.fill();
  if(Math.random()<(e.k==='B'?1:.4)){const[t,q]=rollLoot();GR.push({t,q,x:e.x,y:e.y,dl:.3})}if(e.k==='B'||Math.random()<.12)GR.push({t:'potion',q:1,x:e.x+10,y:e.y+10,dl:.3})}}
function attack(){const it=P.eq;if(!it||P.cd>0||held)return;const d=IT[it.t];P.cd=d.cd;
 if(!d.ammo){P.sw=.18;snd(d.snd);for(const e of E){if(e.dead)continue;const dx=e.x-P.x,dy=e.y-P.y,di=Math.hypot(dx,dy);if(di<d.rng+e.r){if(Math.abs(wrap(Math.atan2(dy,dx)-P.ang))<d.arc/2||di<e.r+14){dmgE(e,d.dmg);e.kx=dx/di*160;e.ky=dy/di*160;if(it.dur!=null)it.dur--}}}if(it.dur!=null&&it.dur<=0){inv.splice(inv.indexOf(it),1);P.eq=inv.find(i=>i.t==='knife')||null;say('Your sword broke!');snd('kill')}return}
 if(!useAmmo(d.ammo)){say('Out of '+IT[d.ammo].n+'!');snd('empty');P.cd=.3;return}
 snd(d.snd);P.fl=.07;shake=Math.max(shake,d.pel?5:d.dmg>30?4:1.5);
 for(let i=0;i<(d.pel||1);i++){const a=P.ang+R(-1,1)*(d.spr||.03);B.push({x:P.x+Math.cos(P.ang)*26,y:P.y+Math.sin(P.ang)*26,vx:Math.cos(a)*d.spd,vy:Math.sin(a)*d.spd,l:d.pel?.4:1.1,d:d.dmg,o:'p'})}}
function update(dt){T+=dt;
 P.cd-=dt;P.sw-=dt;P.dashCd-=dt;P.fl-=dt;P.hf-=dt;msgT-=dt;shake*=.85;for(const k in P.fx)if(P.fx[k]>0)P.fx[k]-=dt;
 const wx=M.x+cam.x,wy=M.y+cam.y;let ta=Math.atan2(wy-P.y,wx-P.x),bd=70;
 for(const e of E){const d=Math.hypot(e.x-wx,e.y-wy);if(d<bd){bd=d;ta=Math.atan2(e.y-P.y,e.x-P.x)}}
 P.ang+=wrap(ta-P.ang)*Math.min(1,dt*20);
 let ix=(K.d?1:0)-(K.a?1:0),iy=(K.s?1:0)-(K.w?1:0),il=Math.hypot(ix,iy);if(il){ix/=il;iy/=il;P.dx=ix;P.dy=iy;P.ph+=dt*10}

  e.fa+=wrap(Math.atan2(dy,dx)-e.fa)*Math.min(1,dt*8);e.ph+=dt*t.spd*.12;
  const s=t.spd*(1+L*.02);
  if(e.k==='s'){if(di>230)mv(e,dx/di*s*dt,dy/di*s*dt);else if(di<160)mv(e,-dx/di*s*dt,-dy/di*s*dt);

 GR=GR.filter(g=>g.q>0);
